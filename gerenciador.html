<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./gerenciador.js" defer></script>
    <link rel="stylesheet" href="gerenciador.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
            <button>Criar nova Tarefa</button>
        </header>
        <nav>
            <ul>
                <li><a href="#">Cadastro</a></li>
                <li><a href="#">Filtros</a></li>
                <li><a href="#">Area de resumo/indicadores</a></li>
                <li><a href="#">Conferir Tarefas</a></li>
            </ul>
        </nav>
        <main>
                <div id="CaixaTarefa">
                    <label>Descrição:</label>
                        <input type="text" placeholder="O que será">
                    <label>Prioridade:</label>
                        <input type="text" placeholder="Baixo, Médio, Alto ou Urgente?">
                    <label>Categoria:</label>
                        <input type="text" placeholder=" É sobre o que a tarefa?">
                    <label>Situação da tarefa: </label>
                        <input type="text" placeholder="Começou, em andamento ou Finalizado?">
                    <label>Data:</label>
                    <input type="text" placeholder=" Para Quando?">
                </div>
            <input type="submit" value="Adicionar Tarefa" class="TarefaFuncao"/>
            <input type="reset" class="TarefaFuncao"/>
        </main>
        <footer>
        </footer>
    </div>
</body>
</html>
