<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./gerenciador.js" defer></script>
    <link rel="stylesheet" href="gerenciador.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
        </header>
        <nav class="menu-cortina">
            <ul>
                <li><a href="#">Tarefas</a>
                    <div class="cortina">
                        <a href="#">Item 1</a>
                        <a href="#">Item 2</a>
                        <a href="#">Item 3</a>
                    </div>
                </li>
                <li><a href="#">Filtros</a>
                <div class="cortina">
                        <a href="#">Item 1</a>
                        <a href="#">Item 2</a>
                        <a href="#">Item 3</a>
                    </div>
                </li>
                <li><a href="#">Area de resumo/indicadores</a>
                <div class="cortina">
                        <a href="#">Item 1</a>
                        <a href="#">Item 2</a>
                        <a href="#">Item 3</a>
                    </div>
                </li>
                <li><a href="#">Conferir Tarefas</a>
                <div class="cortina">
                        <a href="#">Item 1</a>
                        <a href="#">Item 2</a>
                        <a href="#">Item 3</a>
                    </div>
                </li>
            </ul>
        </nav>
        <main>
            <button id="botaoTarefa">Criar nova Tarefa</button>
            <dialog id="meuModal">
                <div id="CaixaTarefa">
                <form id="tarefa">
                    <label>Descrição:</label>
                        <!-- <input type="text" placeholder="O que será?" name="descricao" id="descricao" class="tarefa"> -->
                        <textarea name="descricao" id="descricao" rows="2" cols="25" placeholder="aaaaaaaaaa" autocomplete="off"></textarea>
                    <label>Prioridade:</label>
                    <select name="prioridade" id="prioridade" class="tarefa">
                        <option value="" disabled selected hidden></option>
                        <option value="1">Alta</option>
                        <option value="2">Média</option>
                        <option value="3">Baixa</option>
                    </select>
                    <br>
                    <label>Categoria:</label>
                        <select name="categoria" id="categoria" class="tarefa tarefaSelect">
                            <option value="" disabled selected hidden></option>
                            <option value="1">Estudos</option>
                            <option value="2">Lazer</option>
                            <option value="3">Trabalho</option>
                            <option value="4">Rotina</option>
                        </select>
                    <br>
                    <label>Situação da tarefa: </label>
                        <select name="sitTarefa" id="sitTarefa" class="tarefa tarefaSelect">
                        <option value="" disabled selected hidden></option>
                        <option value="1">Começando</option>
                        <option value="2">Em andamento</option>
                        <option value="3">Concluído</option>
                        </select>
                    <label>Data:</label>
                    <input type="date" name="dataTarefa" id="dataTarefa" class="tarefa">
                    <input type="button" value="Adicionar Tarefa" class="TarefaFuncao" id="cadastrar"/>
                    <input type="reset" class="TarefaFuncao" name="resetTarefa" id="resetTarefa"/>
                    <button type="button" id="btnFechar">Cancelar</button>
                </form>
                </div>
            </dialog>
        </main>
        <footer>
        </footer>
    </div>
</body>
</html>
