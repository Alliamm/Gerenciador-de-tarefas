<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./gerenciador.js" defer></script>
    <link rel="stylesheet" href="gerenciador.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
            <button>Criar nova Tarefa</button>
        </header>
        <nav>
            <p>Cadastro</p>
            <p>Filtros</p>
            <p>Area de resumo/indicadores</p>
            <p>Conferir Tarefas</p>
        </nav>
        <main>
            <div id="CaixaTarefa">
                <p>Descrição: O que será feito?</p>
                <p>Prioridade: Baixo, Médio, Alto ou Urgente?</p>
                <p>Categoria: É sobre o que a tarefa?</p>
                <p>Situação da tarefa: Começou, em andamento ou Finalizado?</p>
                <p>Data: Para Quando?</p>
            </div>
            <button id="AdTarefa">Adicionar Tarefa</button>
            <button id="resetTarefa">Reset</button>
        </main>
        <footer></footer>
    </div>
</body>
</html>
