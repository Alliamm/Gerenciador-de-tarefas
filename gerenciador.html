<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./gerenciador.js" defer></script>
    <link rel="stylesheet" href="gerenciador.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciador de Tarefas</h1>
            <button>Criar nova Tarefa</button>
        </header>
        <nav>
            <ul>
                <li><a href="#">Cadastro</a></li>
                <li><a href="#">Filtros</a></li>
                <li><a href="#">Area de resumo/indicadores</a></li>
                <li><a href="#">Conferir Tarefas</a></li>
            </ul>
        </nav>
        <main>
                <div id="CaixaTarefa">
                <form id="tarefa">
                    <label>Descrição:</label>
                        <input type="text" placeholder="O que será?" name="descricao" id="descricao" class="tarefa">
                    <label>Prioridade:</label>
                    <select name="prioridade" id="prioridade" class="tarefa">
                        <option value="0" disabled selected hidden></option>
                        <option value="1">Alta</option>
                        <option value="2">Média</option>
                        <option value="3">Baixa</option>
                    </select>
                    <br>
                    <label>Categoria:</label>
                        <select name="categoria" id="categoria" class="tarefa">
                            <option value="0" disabled selected hidden></option>
                            <option value="1">Estudos</option>
                            <option value="2">Lazer</option>
                            <option value="3">Trabalho</option>
                            <option value="4">Rotina</option>
                        </select>
                    <br>
                    <label>Situação da tarefa: </label>
                        <select name="sitTarefa" id="sitTarefa" class="tarefa">
                        <option value="0" disabled selected hidden></option>
                        <option value="1">Começando</option>
                        <option value="2">Em andamento</option>
                        <option value="3">Concluído</option>
                        </select>
                    <label>Data:</label>
                    <input type="date" name="dataTarefa" id="dataTarefa" class="tarefa">
                    <input type="button" value="Adicionar Tarefa" class="TarefaFuncao" id="cadastrar"/>
                    <input type="reset" class="TarefaFuncao"/>
                </form>
                </div>
        </main>
        <footer>
        </footer>
    </div>
</body>
</html>
